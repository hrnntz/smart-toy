# .github/workflows/security.yml
# Strix AI Security Scan -- corre en cada Pull Request hacia main
# Complementa el CI existente (ci.yml) con un gate de seguridad automatizado.
#
# SETUP: Agrega estos dos secrets en GitHub -> Settings -> Secrets and variables -> Actions:
#   - STRIX_LLM   -> el model id de tu LLM provider (ej: "openai/gpt-4o" o "anthropic/claude-3-5-sonnet")
#   - LLM_API_KEY -> tu API key del provider (OpenAI, Anthropic, OpenRouter, etc.)

name: Security Scan (Strix)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/security.yml'
  workflow_dispatch: # Permite ejecutar el scan manualmente desde el panel de GitHub Actions

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strix-security-scan:
    name: Strix AI Pentest (diff-scoped)
    runs-on: ubuntu-latest
    continue-on-error: false

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Strix
        run: |
          curl -sSL https://strix.ai/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Strix Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          # Determinar la base de diff según el tipo de evento
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            DIFF_BASE="${{ github.event.before }}"
            # Si el commit previo está vacío (e.g. nueva rama), usar HEAD~1
            if [ "$DIFF_BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$DIFF_BASE" ]; then
              DIFF_BASE="HEAD~1"
            fi
          else
            # Para ejecuciones manuales (workflow_dispatch), comparamos contra HEAD~1
            DIFF_BASE="HEAD~1"
          fi

          echo "🔍 Iniciando scan de seguridad diff-scoped..."
          echo "🌿 Tipo de evento: ${{ github.event_name }}"
          echo "🌿 Base de comparación (diff-base): $DIFF_BASE"

          strix -n \
            -t ./backend \
            --scan-mode quick \
            --scope-mode diff \
            --diff-base "$DIFF_BASE" \
            --max-budget 10 \
            --instruction "Enfocate en OWASP Top 10 en el backend Node.js/TypeScript/Express. Prioriza: IDOR, JWT issues, broken access control, Socket.io authentication bypass. Usa pruebas no destructivas."

      - name: Verify scan completed
        if: always()
        run: |
          RUN_JSON=$(ls -t strix_runs/*/run.json 2>/dev/null | head -1)
          if [ -z "$RUN_JSON" ]; then echo "No se encontro run.json"; exit 1; fi
          STATUS=$(jq -r .status "$RUN_JSON")
          echo "Scan status: $STATUS"
          if [ "$STATUS" != "completed" ]; then echo "Scan no completo: $STATUS"; exit 1; fi
          echo "Scan completado correctamente."

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs
          category: strix-security-scan
        continue-on-error: true

      - name: Post scan summary
        if: always()
        run: |
          VULNS_JSON=$(ls -t strix_runs/*/vulnerabilities.json 2>/dev/null | head -1)
          CRITICAL=0; HIGH=0; MEDIUM=0; LOW=0
          if [ -f "$VULNS_JSON" ]; then
            CRITICAL=$(jq '[.[] | select(.severity == "critical")] | length' "$VULNS_JSON" 2>/dev/null || echo 0)
            HIGH=$(jq '[.[] | select(.severity == "high")] | length' "$VULNS_JSON" 2>/dev/null || echo 0)
            MEDIUM=$(jq '[.[] | select(.severity == "medium")] | length' "$VULNS_JSON" 2>/dev/null || echo 0)
            LOW=$(jq '[.[] | select(.severity == "low")] | length' "$VULNS_JSON" 2>/dev/null || echo 0)
          fi
          TOTAL=$(($CRITICAL + $HIGH + $MEDIUM + $LOW))
          echo "## Strix Security Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ "$TOTAL" -gt 0 ]; then
            echo "| Severidad | Cantidad |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
            echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Sin vulnerabilidades encontradas en los cambios de este PR." >> $GITHUB_STEP_SUMMARY
          fi
